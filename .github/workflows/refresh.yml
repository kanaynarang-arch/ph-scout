name: Refresh saved copies

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/refresh
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +x
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL variable or CRON_SECRET secret is missing" >&2
            exit 1
          fi
          case "$APP_URL" in
            http://*|*/*) echo "APP_URL must be a bare host name (HTTPS is always used)" >&2; exit 1 ;;
          esac
          status=$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/refresh.json -w '%{http_code}' \
            --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" "https://${APP_URL}/api/refresh")
          echo "HTTP ${status}"
          if [ "$status" != "200" ]; then exit 1; fi
          echo "refresh ok"
